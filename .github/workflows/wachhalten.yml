    steps:
      - name: Supabase anfragen
        run: |
          curl -fsS -X POST 'https://wvvcudtqzoolpwltidxo.supabase.co/rest/v1/rpc/setup_open' \
            -H 'apikey: sb_publishable_3k9ydNeh60Orp5JRbUdL4g_I0O0pGZW' \
            -H 'Content-Type: application/json' -d '{}'
          echo
          echo "Supabase hat geantwortet."
