# Wöchentliche, verschlüsselte Sicherung der Datenbank in ein PRIVATES Repository.
# Benötigte Repository-Secrets:
#   SUPABASE_DB_URL  – wie bei "Datenbank aktualisieren"
#   BACKUP_TOKEN     – Fine-grained Token mit "Contents: Read and write" nur für das Sicherungs-Repository
#   BACKUP_PASSWORD  – frei gewähltes, langes Passwort zum Verschlüsseln (gut aufbewahren!)
# Optionale Repository-Variable BACKUP_REPO (Standard: JAZM1309/familienzeit-backup)
name: Datensicherung

on:
  schedule:
    - cron: '23 2 * * 0'
  workflow_dispatch:
  # Wird auch von „Wiederherstellung“ aufgerufen (Sicherung des Stands davor)
  workflow_call:
    inputs:
      zusatz:
        type: string
        default: ''

concurrency:
  group: datensicherung-${{ inputs.zusatz || 'woche' }}
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
      BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
      BACKUP_REPO: ${{ vars.BACKUP_REPO || 'JAZM1309/familienzeit-backup' }}
      ZUSATZ: ${{ inputs.zusatz }}
    steps:
      - name: Voraussetzungen prüfen
        run: |
          missing=""
          [ -z "$DB_URL" ] && missing="$missing SUPABASE_DB_URL"
          [ -z "$BACKUP_TOKEN" ] && missing="$missing BACKUP_TOKEN"
          [ -z "$BACKUP_PASSWORD" ] && missing="$missing BACKUP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Es fehlen Secrets:$missing (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if [ ${#BACKUP_PASSWORD} -lt 12 ]; then
            echo "::error::BACKUP_PASSWORD sollte mindestens 12 Zeichen haben."
            exit 1
          fi

      - name: Datenbank-Werkzeuge installieren
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get -qq install -y postgresql-client >/dev/null
          pg_dump --version

      - name: Sichern und verschlüsseln
        run: |
          set -euo pipefail
          # Wöchentlich: familienzeit-JJJJ-MM-TT; vor einer Wiederherstellung mit Uhrzeit und Zusatz
          if [ -n "$ZUSATZ" ]; then
            case "$ZUSATZ" in *[!a-z-]*) echo "::error::Ungültiger Zusatz"; exit 1;; esac
            STAMP="$(date -u +%Y-%m-%d-%H%M)-$ZUSATZ"
          else
            STAMP=$(date -u +%Y-%m-%d)
          fi
          mkdir -p dump
          pg_dump "$DB_URL" --schema=public --no-owner --no-privileges --format=custom -f dump/familienzeit.dump
          pg_dump "$DB_URL" --data-only --table=auth.users --table=auth.identities --format=custom -f dump/konten.dump
          pg_dump "$DB_URL" --data-only --table=storage.objects --format=custom -f dump/dateiliste.dump
          echo "Familienzeit-Sicherung vom $STAMP. Wiederherstellen mit pg_restore (siehe ANLEITUNG.md)." > dump/LIESMICH.txt
          tar czf - -C dump . | gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSWORD" -o "familienzeit-$STAMP.tar.gz.gpg"
          ls -lh "familienzeit-$STAMP.tar.gz.gpg"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

      - name: Im privaten Repository ablegen (die letzten 12 Wochen-Sicherungen bleiben)
        run: |
          set -euo pipefail
          git clone --quiet "https://x-access-token:${BACKUP_TOKEN}@github.com/${BACKUP_REPO}.git" ziel
          cp "familienzeit-$STAMP.tar.gz.gpg" ziel/
          cd ziel
          { ls | grep -E '^familienzeit-[0-9]{4}-[0-9]{2}-[0-9]{2}\.tar\.gz\.gpg$' || true; } | sort | head -n -12 | xargs -r git rm -q
          # Stände vor Wiederherstellungen: die letzten 5 bleiben
          { ls | grep -E '^familienzeit-.*-vor-wiederherstellung\.tar\.gz\.gpg$' || true; } | sort | head -n -5 | xargs -r git rm -q
          git add -A
          git -c user.name="Familienzeit" -c user.email="noreply@github.com" commit -q -m "Sicherung $STAMP"
          git push -q origin HEAD:main
          echo "Sicherung $STAMP abgelegt in $BACKUP_REPO."
