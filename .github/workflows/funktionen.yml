# Veröffentlicht die Server-Funktionen (supabase/functions) in Supabase.
# Benötigt das Repository-Secret SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens).
name: Funktionen veröffentlichen

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:

concurrency:
  group: funktionen
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: wvvcudtqzoolpwltidxo
    steps:
      - uses: actions/checkout@v4

      - name: Zugang prüfen
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Das Secret SUPABASE_ACCESS_TOKEN fehlt (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push-Funktion veröffentlichen
        run: supabase functions deploy push --project-ref "$PROJECT_REF" --no-verify-jwt --yes

      - name: Passwort-Funktion veröffentlichen
        run: supabase functions deploy passwort --project-ref "$PROJECT_REF" --no-verify-jwt --yes
